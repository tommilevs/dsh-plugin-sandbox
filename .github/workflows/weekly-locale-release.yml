name: Weekly Locale Release

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-locale-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check for locale-only changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$previous" ]; then echo 'summary=No prior release tag; no release created.' >> "$GITHUB_OUTPUT"; exit 0; fi
          mapfile -t files < <(git diff --name-only "$previous"..HEAD)
          if [ "${#files[@]}" -eq 0 ] || printf '%s\n' "${files[@]}" | grep -Ev '^locales/.*\.json$' >/dev/null; then
            echo 'summary=No locale-only changes; no release created.' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Explain no-release result
        if: steps.changes.outputs.publish != 'true'
        run: echo "${{ steps.changes.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.changes.outputs.publish == 'true'
        run: npm install --ignore-scripts
      - if: steps.changes.outputs.publish == 'true'
        run: npm test
      - name: Build next patch release
        if: steps.changes.outputs.publish == 'true'
        id: version
        run: |
          npm version patch --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm pack
          sha256sum dsh-plugin-sandbox-*.tgz > dsh-plugin-sandbox-$version.tgz.sha256
      - name: Create tag and GitHub Release
        if: steps.changes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" dsh-plugin-sandbox-*.tgz dsh-plugin-sandbox-*.tgz.sha256 --generate-notes --title "$tag"
