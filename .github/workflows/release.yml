name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Verify tag matches package version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Pack verified release
        run: |
          npm pack
          sha256sum dsh-plugin-sandbox-*.tgz > dsh-plugin-sandbox-${GITHUB_REF_NAME#v}.tgz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dsh-plugin-sandbox-*.tgz
            dsh-plugin-sandbox-*.tgz.sha256
