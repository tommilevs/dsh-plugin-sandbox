name: Locale Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    if: github.repository == 'tommilevs/dsh-plugin-sandbox'
    runs-on: ubuntu-latest
    steps:
      - name: Validate locale contribution without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/locales work/locales/metadata
          files_json="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100")"
          mapfile -t files < <(printf '%s' "$files_json" | jq -r '.[].filename')
          if [ "${#files[@]}" -lt 1 ] || [ "${#files[@]}" -gt 2 ]; then
            echo "Locale PR must change one translation file, with an optional matching metadata file." >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          locale_file="$(printf '%s\n' "${files[@]}" | grep '^locales/[^/][^/]*\.json$' || true)"
          metadata_file="$(printf '%s\n' "${files[@]}" | grep '^locales/metadata/[^/][^/]*\.json$' || true)"
          if [ -z "$locale_file" ] || [ "$(printf '%s\n' "${files[@]}" | grep -Ev '^locales/([^/][^/]*\.json|metadata/[^/][^/]*\.json)$' || true)" ]; then
            echo "PR must contain one locales/<code>.json and may contain only its metadata file." >&2
            exit 1
          fi
          locale="${locale_file#locales/}"
          metadata="${metadata_file#locales/metadata/}"
          if [ -z "$metadata" ]; then
            metadata="$locale"
            metadata_repo="$REPO"
            metadata_ref="$BASE_SHA"
          else
            metadata_repo="$HEAD_REPO"
            metadata_ref="$HEAD_SHA"
          fi
          if [ "$locale" = "en.json" ] || [ "$metadata" = "en.json" ]; then
            echo "English source locale cannot use the community auto-merge lane." >&2
            exit 1
          fi
          if [ "${locale%.json}" != "${metadata%.json}" ]; then
            echo "Translation and metadata locale codes must match." >&2
            exit 1
          fi
          if ! printf '%s' "${locale%.json}" | grep -Eq '^[a-z]{2}$'; then
            echo "Locale code must be exactly two lowercase Latin letters." >&2
            exit 1
          fi
          gh api "repos/$REPO/contents/locales/en.json?ref=$BASE_SHA" --jq .content | tr -d '\n' | base64 -d > work/locales/en.json
          gh api "repos/$HEAD_REPO/contents/locales/$locale?ref=$HEAD_SHA" --jq .content | tr -d '\n' | base64 -d > "work/locales/$locale"
          gh api "repos/$metadata_repo/contents/locales/metadata/$metadata?ref=$metadata_ref" --jq .content | tr -d '\n' | base64 -d > "work/locales/metadata/$metadata"
          gh api "repos/$REPO/contents/scripts/validate-locale.mjs?ref=$BASE_SHA" --jq .content | tr -d '\n' | base64 -d > work/validate-locale.mjs
          node work/validate-locale.mjs work/locales/en.json "work/locales/$locale" "work/locales/metadata/$metadata"
          echo "Locale contribution validated: locales/$locale + locales/metadata/$metadata"

  auto_merge:
    needs: validate
    if: needs.validate.result == 'success' && github.repository == 'tommilevs/dsh-plugin-sandbox'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve locale-only PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          gh pr review "$PR_URL" --approve --body 'Automated approval: locale-only contribution passed Locale Guard.'
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          gh pr merge "$PR_URL" --auto --squash --delete-branch
